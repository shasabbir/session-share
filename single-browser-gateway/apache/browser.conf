# Apache2 VirtualHost configuration for Single Website Cloud Browser Gateway
# Place in: /etc/apache2/sites-available/browser.conf

<VirtualHost *:80>
    ServerName _
    ServerAdmin webmaster@localhost

    # 1. Global Basic Authentication
    # Protects both the browser and admin control panels
    <Location />
        AuthType Basic
        AuthName "Restricted Browser Gateway"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Location>

    # 2. WebSocket & Proxy Engine Configuration
    RewriteEngine On
    ProxyPreserveHost On

    # Intercept WebSocket upgrade requests for noVNC
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/example.com/?(.*) "ws://127.0.0.1:6080/$1" [P,L]

    # Auto-redirect '/example.com' or '/example.com/' straight to auto-connected, auto-scaled viewer
    RewriteRule ^/example.com/?$ /example.com/vnc.html?autoconnect=true&resize=remote&path=example.com/websockify [R=302,L]

    # Reverse proxy HTTP traffic to noVNC web server
    ProxyPass /example.com/ http://127.0.0.1:6080/
    ProxyPassReverse /example.com/ http://127.0.0.1:6080/

    # 3. Optional Admin Control Panel (Single-file Python server on port 8088)
    ProxyPass /admin http://127.0.0.1:8088/
    ProxyPassReverse /admin http://127.0.0.1:8088/

    # Logging
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/cloud_browser_error.log
    CustomLog ${APACHE_LOG_DIR}/cloud_browser_access.log combined
</VirtualHost>
