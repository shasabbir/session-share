# Apache2 VirtualHost configuration for Single Website Cloud Browser Gateway
# Place in: /etc/apache2/sites-available/000-browser.conf

<VirtualHost *:5151>
    ServerName gateway
    ServerAlias *
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/browser-gateway

    DirectoryIndex index.html

    <Directory /var/www/browser-gateway>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 1. Global Basic Authentication
    <Location />
        AuthType Basic
        AuthName "Restricted Browser Gateway"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Location>

    RewriteEngine On
    ProxyPreserveHost On

    # 2. Clean URL Handler: Serve seamless fullscreen viewer for ANY public URL
    # (Matches root '/', '/www.chatgpt.com', '/chatgpt', etc. WITHOUT external redirect)
    RewriteCond %{REQUEST_URI} !^/(mobile|desktop|admin) [NC]
    RewriteRule ^.*$ /index.html [L]

    # 3. Direct shortlinks for explicit views
    RewriteRule ^/mobile/?$ /mobile/vnc.html?autoconnect=true&resize=remote&path=mobile/websockify [R=302,L]
    RewriteRule ^/desktop/?$ /desktop/vnc.html?autoconnect=true&resize=remote&path=desktop/websockify [R=302,L]

    # 4. WebSocket Upgrade Forwarding
    # Mobile WebSocket (Port 6081)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/mobile/?(.*) "ws://127.0.0.1:6081/$1" [P,L]

    # Desktop WebSocket (Port 6080)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/desktop/?(.*) "ws://127.0.0.1:6080/$1" [P,L]

    # 5. HTTP Reverse Proxy
    # Mobile Browser Gateway -> 127.0.0.1:6081
    ProxyPass /mobile/ http://127.0.0.1:6081/
    ProxyPassReverse /mobile/ http://127.0.0.1:6081/

    # Desktop Browser Gateway -> 127.0.0.1:6080
    ProxyPass /desktop/ http://127.0.0.1:6080/
    ProxyPassReverse /desktop/ http://127.0.0.1:6080/

    # 6. Admin Control Panel (Micro-Server on port 8088)
    ProxyPass /admin http://127.0.0.1:8088/
    ProxyPassReverse /admin http://127.0.0.1:8088/

    # Logging
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/cloud_browser_error.log
    CustomLog ${APACHE_LOG_DIR}/cloud_browser_access.log combined
</VirtualHost>
